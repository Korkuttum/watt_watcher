name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip component
        run: |
          cd custom_components/watt_watcher
          zip -r ../../watt_watcher.zip ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: watt_watcher.zip
          asset_name: watt_watcher.zip
          tag: ${{ github.ref }}
          overwrite: true
